# Database Keepalive configuration. Keep credentials in environment variables.
# Use spaces for indentation. Optional settings use the defaults shown below.

# Enable at least one type. Disabled types need no credentials or connections.
database_types:
  supabase: true
  db2: true
  adb: true
  mysql: true

# Add one or more instances for every enabled type, in any region.
# IDs are unique lowercase names (letters, digits, underscores; max 64 characters).
# env_prefix is unique and uppercase; it selects the instance's credential names.
# For example, SUPABASE selects SUPABASE_URL and SUPABASE_SECRET_KEY.
# region is an optional display label; the endpoint determines the actual region.
# name optionally overrides the generated title. display_order sorts the cards.
# Keep IDs and list order stable: they influence planned times and request metadata.
instances:
  - id: supabase
    type: supabase
    env_prefix: SUPABASE
    display_order: 1
    # name: My Supabase Database
    # region: Your database region

  - id: adb_us
    type: adb
    region: United States
    env_prefix: OCI_ADB_US
    display_order: 3

  - id: adb_jp
    type: adb
    region: Japan
    env_prefix: OCI_ADB_JP
    display_order: 5

  - id: db2
    type: db2
    env_prefix: DB2
    display_order: 2

  - id: mysql_jp
    type: mysql
    region: Japan
    env_prefix: MYSQL
    # Optional: remove this line to connect directly instead of Access TCP.
    # Selects TUNNEL_SERVICE_HOSTNAME, _TOKEN_ID and _TOKEN_SECRET.
    # A tunnel requires a loopback MySQL host and a distinct local listener port.
    tunnel_prefix: TUNNEL_SERVICE
    display_order: 4

schedule:
  # Each instance independently draws an inclusive daily count in this range.
  # Minimum is 1; maximum is 24. Set both equal for a fixed daily count.
  daily_min: 1
  daily_max: 3
  # IANA timezone for calendar days; daylight saving time is handled automatically.
  timezone: Asia/Singapore
  # Total attempts per scheduled check-in, including the first attempt (1–10).
  attempts: 3

display:
  # Records per database card and API page (1–100).
  page_size: 10
  # Try Google Fonts families in order, then use the listed system fallbacks.
  # Up to 10 families per list. A failed CSS/font download tries the next family.
  fonts:
    - Ubuntu
    - system-ui
    - sans-serif
  # Separate stack for timestamps and record numbers.
  mono_fonts:
    - Ubuntu Mono
    - monospace
  # Automatic visible-page refresh: 0 disables it; otherwise 30–86400 seconds.
  refresh_seconds: 0

runtime:
  # Read-cache lifetime in seconds (0–3600); 0 disables caching.
  cache_seconds: 60
  # Maximum concurrent HTTP handlers per container (1–64).
  concurrency: 16

deployment:
  # Your GCP project ID, Cloud Run region and service name.
  # Deployment region is independent of database regions.
  project: complete-silo
  region: us-west1
  service: database-keepalive
  # Optional Artifact Registry repository; omitted means the service name.
  # repository: database-keepalive
