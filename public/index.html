<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Keepalive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>🚀 Database Keepalive</h1>
        <p>Automated Multi-Cloud Database Keepalive Monitor</p>
      </div>
    </header>

    <div class="summary-bar">
      <div class="summary-item">
        <div class="label">Total Instances</div>
        <div class="val" id="totalInstances">-</div>
      </div>
      <div class="summary-item">
        <div class="label">Health Status</div>
        <div class="val" id="healthyCount">-</div>
      </div>
      <div class="summary-item">
        <div class="label">Timezone</div>
        <div class="val tz-val" id="tzDisplay">-</div>
      </div>
    </div>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div id="grid" class="grid">
      <!-- Dynamic instance cards generated via JavaScript -->
      <div class="loading-state">
        Querying live remote database keepalive records...
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
