# ==============================================================================
# Database Keepalive - Example Configuration (config.example.yaml)
# ==============================================================================

# 1. Server settings (optional, defaults provided)
server:
  listen: ":8080"                  # HTTP listening address
  title: "Database Keepalive"      # Web dashboard title

# 2. Schedule policy (optional, defaults provided)
schedule:
  # Option A: Fixed daily check-in count (e.g., exactly 2 times/day)
  # count: 2

  # Option B: Randomized daily range (e.g., 1 to 3 times/day)
  min: 1
  max: 3

  # Timezone for daily schedule boundaries and UI formatting
  # Default is "Local" (host system timezone), or specify IANA timezone e.g. "UTC", "Asia/Shanghai"
  timezone: "Local"

# 3. Database instance matrix (unlimited instances across any global regions)
instances:
  # --- Instance 1: Supabase Database ---
  - id: supabase_main
    type: supabase
    name: "Supabase Main"
    region: "🇸🇬 Singapore"
    url: "https://your-project.supabase.co"
    key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." # Service Role or Secret API Key

  # --- Instance 2: Oracle Autonomous Database (US Region) ---
  - id: adb_us
    type: oracle
    name: "Oracle ADB (US East)"
    region: "🇺🇸 US Ashburn"
    url: "https://xxx.adb.us-ashburn-1.oraclecloudapps.com/ords/admin"
    user: "ADMIN"
    password: "YourPassword123#"

  # --- Instance 3: Oracle Autonomous Database (Japan Region) ---
  - id: adb_jp
    type: oracle
    name: "Oracle ADB (Japan Osaka)"
    region: "🇯🇵 Japan Osaka"
    url: "https://yyy.adb.ap-osaka-1.oraclecloudapps.com/ords/admin"
    user: "ADMIN"
    password: "YourPassword123#"

  # --- Instance 4: MySQL HeatWave Database (Direct or Tunnel) ---
  - id: mysql_jp
    type: mysql
    name: "MySQL HeatWave"
    region: "🇯🇵 Japan Osaka"
    host: "10.0.1.25"              # Internal IP, Public IP, or 127.0.0.1
    port: 3306
    user: "admin"
    password: "YourPassword123#"
    database: "keepalive"

    # Optional: If connecting through Cloudflare Access TCP Tunnel across clouds/networks
    # tunnel:
    #   hostname: "mysql-osaka.yourdomain.com"
    #   service_token_id: "your-cf-token-id"
    #   service_token_secret: "your-cf-token-secret"
