name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.10.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Install locked development tools
        run: npm ci

      - name: Check syntax, structure, and committed secrets
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Test Db2 and MySQL bridges with mocked databases
        run: npm run test:bridge

      - name: Check native service syntax
        run: python3 -m py_compile service/*.py bridge/db.py bridge/mysql_db.py
