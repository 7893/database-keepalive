name: Check and release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag already contained in main
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: database-keepalive-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Go and native container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release commit
        id: commit
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$RELEASE" = true ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Check sources and credentials
        run: |
          go run ./cmd/check
      - name: Test application and native drivers without production credentials
        run: |
          go test -race ./...
          go vet ./...
      - name: Build Linux amd64 runtime including Db2
        run: |
          docker build --platform linux/amd64 --target native-test --tag database-keepalive:native-test .
          docker build --platform linux/amd64 --tag database-keepalive:check .
          docker run --rm --entrypoint /bin/sh database-keepalive:check -c 'ldd /app/database-keepalive > /tmp/libs && cat /tmp/libs && ! grep -q "not found" /tmp/libs'

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: database-keepalive-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Read deployment settings
        run: go run ./cmd/config >> "$GITHUB_ENV"
      - name: Build and publish the selected commit
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/$SERVICE:$COMMIT"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy image preserving runtime configuration
        run: |
          gcloud run deploy "$SERVICE" --image="$IMAGE" --project="$PROJECT" --region="$REGION" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          go run ./cmd/smoke "$URL"
          REVISION=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.latestReadyRevisionName)')
          echo "Commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "Page: $URL" >> "$GITHUB_STEP_SUMMARY"
